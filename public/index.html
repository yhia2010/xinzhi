<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新中智查 · 管理后台</title>
<!-- SheetJS for Excel import/export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F6FA; color: #333; }
a { color: inherit; text-decoration: none; }

/* 登录页 */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1F5F4F 0%, #134634 100%); }
.login-card { background: #fff; border-radius: 16px; padding: 48px 40px; width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
.login-emblem { width: 110px; height: 78px; margin: 0 auto 16px; border-radius: 39px; background: #fff; padding: 4px; box-shadow: 0 6px 20px rgba(31,95,79,0.2); }
.login-emblem img { width: 100%; height: 100%; border-radius: 35px; display: block; }
.login-title { font-size: 24px; font-weight: 700; text-align: center; margin: 16px 0 8px; color: #1F5F4F; }
.login-sub { font-size: 14px; color: #888; text-align: center; margin-bottom: 28px; }
.login-tabs { display: flex; gap: 0; margin-bottom: 24px; border: 1px solid #1F5F4F; border-radius: 8px; overflow: hidden; }
.login-tab { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; color: #1F5F4F; cursor: pointer; transition: all 0.2s; }
.login-tab.active { background: #1F5F4F; color: #fff; }
.form-item { margin-bottom: 20px; }
.form-label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; }
.form-input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-input:focus { border-color: #1F5F4F; }
.btn-primary { width: 100%; height: 46px; border: none; border-radius: 23px; background: linear-gradient(135deg, #1F5F4F 0%, #134634 100%); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 12px; }
.btn-primary:hover { opacity: 0.92; }
.btn-primary:disabled { background: #A8C9BF; cursor: not-allowed; }
.tips { font-size: 12px; color: #999; text-align: center; margin-top: 16px; line-height: 1.6; }
.cloud-status { font-size: 12px; text-align: center; margin-top: 12px; padding: 6px; border-radius: 6px; }
.cloud-status.ok { background: #E0EDE8; color: #2D7A5F; }
.cloud-status.err { background: #FFE0E0; color: #C62828; }
.cloud-status.loading { background: #FFF3E0; color: #FF9800; }

/* 后台布局 */
.app { display: none; min-height: 100vh; }
.app.show { display: flex; }
.sidebar { width: 220px; background: #fff; border-right: 1px solid #E8E8E8; display: flex; flex-direction: column; }
.logo { padding: 24px 20px; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; gap: 10px; }
.logo-icon { font-size: 28px; }
.logo-text { font-size: 15px; font-weight: 700; color: #333; }
.nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-item { display: flex; align-items: center; padding: 12px 20px; font-size: 14px; color: #666; cursor: pointer; transition: all 0.15s; }
.nav-item:hover { background: #F5F6FA; color: #1F5F4F; }
.nav-item.active { background: #E0EDE8; color: #1F5F4F; font-weight: 500; border-right: 3px solid #1F5F4F; }
.nav-icon { margin-right: 10px; font-size: 18px; }
.logout { padding: 16px 20px; border-top: 1px solid #E8E8E8; font-size: 14px; color: #888; cursor: pointer; }
.logout:hover { color: #FF5252; }

.main { flex: 1; display: flex; flex-direction: column; }
.topbar { height: 60px; background: #fff; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.page-title { font-size: 18px; font-weight: 600; }
.user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #666; }
.user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #1F5F4F; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.content { flex: 1; padding: 24px; overflow-y: auto; }

/* 卡片 */
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.card-title::before { content: ''; width: 4px; height: 16px; background: #1F5F4F; border-radius: 2px; }

/* 统计 */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.stat-num { font-size: 32px; font-weight: 700; color: #1F5F4F; }
.stat-label { font-size: 13px; color: #888; margin-top: 4px; }
.stat-trend { font-size: 12px; color: #2D7A5F; margin-top: 4px; }

/* 表格 */
.toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.search-input { width: 240px; height: 36px; padding: 0 14px; border: 1px solid #E0E0E0; border-radius: 6px; font-size: 14px; outline: none; }
.search-input:focus { border-color: #1F5F4F; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border: 1px solid #E0E0E0; border-radius: 6px; background: #fff; color: #555; font-size: 14px; cursor: pointer; transition: all 0.15s; }
.btn:hover { border-color: #1F5F4F; color: #1F5F4F; }
.btn.primary { background: #1F5F4F; color: #fff; border-color: #1F5F4F; }
.btn.primary:hover { background: #134634; color: #fff; }
.btn.danger { color: #FF5252; border-color: #FFD0D0; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.danger:hover { background: #FF5252; color: #fff; border-color: #FF5252; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 12px; border-bottom: 1px solid #F0F0F0; }
th { background: #F8F9FB; color: #666; font-weight: 500; font-size: 13px; }
tr:hover td { background: #FAFBFC; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
.tag.success { background: #E0EDE8; color: #2D7A5F; }
.tag.warning { background: #FFF3E0; color: #FF9800; }
.tag.info { background: #E0EDE8; color: #1F5F4F; }
.avatar-cell { width: 32px; height: 32px; border-radius: 50%; background: #1F5F4F; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; margin-right: 8px; vertical-align: middle; }

/* 复选框 */
.cb { width: 16px; height: 16px; border: 2px solid #ccc; border-radius: 4px; cursor: pointer; display: inline-block; vertical-align: middle; position: relative; transition: all 0.15s; }
.cb.checked { background: #1F5F4F; border-color: #1F5F4F; }
.cb.checked::after { content: '✓'; position: absolute; top: -2px; left: 1px; color: #fff; font-size: 12px; font-weight: bold; }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-mask.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 520px; max-width: 90vw; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid #F0F0F0; display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: #999; font-size: 20px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-footer { padding: 16px 20px; border-top: 1px solid #F0F0F0; display: flex; justify-content: flex-end; gap: 10px; }

/* 消息提示 */
.toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 2000; opacity: 0; transition: opacity 0.2s; }
.toast.show { opacity: 1; }
.toast.success { background: #2D7A5F; }
.toast.error { background: #FF5252; }
.toast.info { background: #1F5F4F; }

/* 上传 */
.upload-area { border: 2px dashed #A8C9BF; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
.upload-area:hover { border-color: #1F5F4F; background: #F8FBFF; }
.upload-icon { font-size: 48px; }
.upload-text { color: #1F5F4F; margin-top: 12px; font-size: 14px; }
.upload-hint { color: #999; font-size: 12px; margin-top: 4px; }

/* Tab */
.tabs { display: flex; border-bottom: 1px solid #E8E8E8; margin-bottom: 20px; }
.tab { padding: 10px 20px; font-size: 14px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #1F5F4F; border-color: #1F5F4F; font-weight: 500; }

/* 进度条 */
.progress { height: 6px; background: #F0F0F0; border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #1F5F4F, #2D7A5F); border-radius: 3px; transition: width 0.3s; }

/* 筛选标签 */
.filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-tag { padding: 6px 14px; font-size: 13px; border-radius: 20px; background: #fff; color: #666; border: 1px solid #E8E8E8; cursor: pointer; }
.filter-tag.active { background: #1F5F4F; color: #fff; border-color: #1F5F4F; }

/* 项目卡片 */
.project-card { border: 1px solid #F0F0F0; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.project-card.pinned { border-color: #1F5F4F; background: #F8FBF9; }
.pin-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #1F5F4F; color: #fff; font-size: 11px; margin-left: 8px; }
.col-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #E0EDE8; color: #1F5F4F; font-size: 12px; margin: 2px; }

/* 预览表格 */
.preview-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.preview-table th, .preview-table td { border: 1px solid #E8E8E8; padding: 8px; text-align: center; }
.preview-table th { background: #E0EDE8; color: #1F5F4F; }

/* 空状态 */
.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }

/* 加载中 */
.loading-box { text-align: center; padding: 60px 20px; color: #999; }
.loading-spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid #E0EDE8; border-top-color: #1F5F4F; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<script>
// ========== API 配置 ==========
// ★ 部署后替换为你的 Vercel API 地址 ★
var API_BASE = 'https://xinzhi-two.vercel.app/api';
var apiReady = true; // HTTP API 无需初始化，直接可用

// ========== 全局状态 ==========
var currentUser = null;
var userRole = 'admin';
var loginTab = 'admin';
var currentPage = 'dashboard';
var batchMode = false;
var selectedStudents = [];
var recordBatchMode = false;
var selectedRecords = [];
var projPreviewData = null;

// ========== 数据缓存（从云端加载） ==========
var data = {
  teachers: [],
  students: [],
  projects: [],
  records: [],
  activities: [],
  logs: []         // 本地数据
};

// ========== 工具函数 ==========
function fmtTime(ts) {
  var d = new Date(ts);
  var p = function(n) { return n < 10 ? '0'+n : ''+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function fmtDate(ts) {
  var d = new Date(ts);
  var p = function(n) { return n < 10 ? '0'+n : ''+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function maskIdCard(id) {
  if (!id) return id;
  id = String(id);
  if (id.length <= 6) return id.substring(0,1) + '****' + id.substring(id.length-1);
  if (id.length < 10) return id.substring(0,2) + '****' + id.substring(id.length-2);
  return id.substring(0,4) + '********' + id.substring(id.length-4);
}
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || 'info');
  setTimeout(function() { t.className = 'toast ' + (type || 'info'); }, 2500);
}
function openModal(title, body, footer) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = footer || '';
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function confirmDialog(msg, cb) {
  openModal('确认操作', '<p style="padding:8px 0;font-size:14px">' + msg + '</p>',
    '<button class="btn" onclick="closeModal()">取消</button>' +
    '<button class="btn primary" id="confirmOk">确定</button>');
  document.getElementById('confirmOk').onclick = function() { closeModal(); cb(); };
}
function addLog(user, action, detail) {
  data.logs.unshift({ time: fmtTime(Date.now()), user: user, action: action, detail: detail });
}
function showLoading(msg) {
  document.getElementById('content').innerHTML = '<div class="loading-box"><div class="loading-spinner"></div><div id="loadingText">' + (msg || '加载中...') + '</div></div>';
}

// ========== API 连接检测 ==========
async function initCloud() {
  var statusEl = document.getElementById('cloudStatus');
  try {
    statusEl.className = 'cloud-status loading';
    statusEl.textContent = '正在连接 API...';
    var res = await fetch(API_BASE);
    var data = await res.json();
    if (data.success) {
      apiReady = true;
      statusEl.className = 'cloud-status ok';
      statusEl.textContent = '✅ API 已连接';
      console.log('[API] 连接成功');
    } else {
      throw new Error('API 返回异常');
    }
  } catch (e) {
    apiReady = false;
    statusEl.className = 'cloud-status err';
    statusEl.textContent = '⚠️ API 连接失败: ' + e.message;
    console.error('[API] 连接失败:', e);
  }
}

// 页面加载时初始化
window.addEventListener('load', function() {
  initCloud();
});

// ========== 加载数据 ==========
async function loadCloudData() {
  try {
    var results = await Promise.all([
      callApi('getTeachers'),
      callApi('getStudents'),
      callApi('getProjects'),
      callApi('getRecords'),
      callApi('getActivities')
    ]);
    data.teachers = results[0].data || [];
    data.students = results[1].data || [];
    data.projects = results[2].data || [];
    data.records = results[3].data || [];
    data.activities = results[4].data || [];
    console.log('[API] 数据加载完成：教师' + data.teachers.length + ' 学生' + data.students.length + ' 项目' + data.projects.length + ' 记录' + data.records.length + ' 活动' + data.activities.length);
  } catch (e) {
    console.error('[API] 数据加载失败:', e);
    toast('数据加载失败: ' + e.message, 'error');
  }
}

// ========== API 调用 ==========
async function callApi(action, params) {
  var reqData = Object.assign({ action: action }, params || {});
  console.log('[callApi] 请求:', action);
  var res = await fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(reqData)
  });
  var result = await res.json();
  console.log('[callApi] 返回:', action, result.success ? '成功' : '失败');
  if (result && result.success === false) {
    throw new Error(result.message || '操作失败');
  }
  return result;
}

// ========== 登录 ==========
function switchLoginTab(tab) {
  loginTab = tab;
  document.querySelectorAll('.login-tab').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
  document.getElementById('adminLoginForm').style.display = tab === 'admin' ? '' : 'none';
  document.getElementById('teacherLoginForm').style.display = tab === 'teacher' ? '' : 'none';
}

async function doAdminLogin() {
  var id = document.getElementById('loginId').value.trim();
  var pwd = document.getElementById('loginPwd').value.trim();
  if (!id || !pwd) { toast('请填写完整', 'error'); return; }

  var btn = document.getElementById('adminLoginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    var result = await callApi('login', { role: 'admin', adminId: id, adminPassword: pwd });
    userRole = 'admin';
    currentUser = result.data;
    await loadCloudData();
    enterApp();
  } catch (e) {
    toast(e.message || '账号或密码错误', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

async function doTeacherLogin() {
  var phone = document.getElementById('teacherPhone').value.trim();
  var pwd = document.getElementById('teacherPwd').value.trim();
  if (phone.length !== 11 || pwd.length !== 6) { toast('请输入11位手机号和6位密码', 'error'); return; }

  var btn = document.getElementById('teacherLoginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    var result = await callApi('login', { role: 'teacher', phone: phone, password: pwd });
    userRole = 'teacher';
    currentUser = result.data;
    await loadCloudData();
    enterApp();
  } catch (e) {
    toast(e.message || '手机号或密码错误', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function enterApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('adminNav').style.display = userRole === 'admin' ? '' : 'none';
  document.getElementById('teacherNav').style.display = userRole === 'teacher' ? '' : 'none';
  document.getElementById('userAvatar').textContent = currentUser.name[0];
  document.getElementById('userName').textContent = currentUser.name + (userRole === 'teacher' ? '（教师）' : '');
  document.getElementById('logoText').textContent = userRole === 'teacher' ? '新中智查 · 教师端' : '新中智查 · 管理后台';
  var defaultPage = userRole === 'teacher' ? 'tDashboard' : 'dashboard';
  switchPage(defaultPage);
  toast('登录成功', 'success');
  addLog(currentUser.name, '登录', userRole === 'admin' ? '管理员登录' : '教师登录');
}

function doLogout() {
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('teacherPhone').value = '';
  document.getElementById('teacherPwd').value = '';
  currentUser = null;
  userRole = 'admin';
  data = { teachers: [], students: [], projects: [], records: [], activities: [], logs: [] };
}

// ========== 路由 ==========
function switchPage(page) {
  currentPage = page;
  var navId = userRole === 'teacher' ? 'teacherNav' : 'adminNav';
  var nav = document.getElementById(navId);
  nav.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });

function filterStudent() {
  var searchInput = document.getElementById('searchStudent');
  var kw = (searchInput ? searchInput.value : '').toLowerCase();
  window._lastStudentSearch = kw;
  // 重新渲染以应用过滤
  var c = document.getElementById('content');
  c.innerHTML = pages.parents();
  // 恢复搜索框
  var si2 = document.getElementById('searchStudent');
  if (si2 && window._lastStudentSearch) {
    si2.value = window._lastStudentSearch;
  }
  // 在当前可见行上应用关键词过滤
  document.querySelectorAll('#studentTable tbody tr').forEach(function(tr) {
    tr.style.display = tr.textContent.toLowerCase().includes(kw) ? '' : 'none';
  });
}

var currentClassFilter = '';
function setClassFilter(cls, e) {
  if (e) e.preventDefault && e.preventDefault();
  currentClassFilter = cls;
  // 状态驱动重渲染：重新调用 pages.parents()，active 状态和过滤都基于 currentClassFilter
  var c = document.getElementById('content');
  c.innerHTML = pages.parents();
  // 恢复搜索框的值
  var searchInput = document.getElementById('searchStudent');
  if (searchInput && window._lastStudentSearch) {
    searchInput.value = window._lastStudentSearch;
    filterStudent();
  }
}

function toggleBatchMode() {
  batchMode = !batchMode;
  selectedStudents = [];
  var btn = document.getElementById('batchToggleBtn');
  var batchBtn = document.getElementById('batchDeleteBtn');
  var th = document.getElementById('batchTh');
  if (!th) return;
  btn.textContent = batchMode ? '退出批量' : '批量管理';
  btn.className = batchMode ? 'btn primary' : 'btn';
  th.style.display = batchMode ? '' : 'none';
  document.querySelectorAll('#studentTable .batch-td').forEach(function(td) { td.style.display = batchMode ? '' : 'none'; });
  document.querySelectorAll('#studentTable .action-td').forEach(function(td) { td.style.display = batchMode ? 'none' : ''; });
  if (batchMode) {
    batchBtn.style.display = '';
    updateBatchCount();
  } else {
    batchBtn.style.display = 'none';
    var cb = document.getElementById('selectAllCb');
    if (cb) cb.classList.remove('checked');
  }
}

function toggleSelectAll() {
  var cb = document.getElementById('selectAllCb');
  var checked = !cb.classList.contains('checked');
  cb.classList.toggle('checked');
  selectedStudents = [];
  document.querySelectorAll('#studentTable tbody tr').forEach(function(tr) {
    if (tr.style.display === 'none') return;
    var id = tr.getAttribute('data-id');
    var studentCb = tr.querySelector('.cb');
    if (checked) {
      studentCb.classList.add('checked');
      selectedStudents.push(id);
    } else {
      studentCb.classList.remove('checked');
    }
  });
  updateBatchCount();
}

function toggleSelectStudent(id) {
  var idx = selectedStudents.indexOf(id);
  var tr = document.querySelector('#studentTable tbody tr[data-id="'+id+'"]');
  var cb = tr.querySelector('.cb');
  if (idx > -1) {
    selectedStudents.splice(idx, 1);
    cb.classList.remove('checked');
  } else {
    selectedStudents.push(id);
    cb.classList.add('checked');
  }
  updateBatchCount();
}

function updateBatchCount() {
  var el = document.getElementById('batchCount');
  if (el) el.textContent = selectedStudents.length;
  var allVisible = [];
  document.querySelectorAll('#studentTable tbody tr').forEach(function(tr) {
    if (tr.style.display !== 'none') allVisible.push(tr.getAttribute('data-id'));
  });
  var cb = document.getElementById('selectAllCb');
  if (cb && allVisible.length > 0 && allVisible.every(function(id) { return selectedStudents.indexOf(id) > -1; })) {
    cb.classList.add('checked');
  } else if (cb) {
    cb.classList.remove('checked');
  }
}

// 分批导入，避免单次调用数据量过大
async function batchImport(type, items) {
  var action = type === 'teacher' ? 'batchAddTeachers' : 'batchAddStudents';
  var dataKey = type === 'teacher' ? 'teachers' : 'students';
  var batchSize = 5; // 每批 5 条，避免云函数超时
  var total = 0;
  for (var i = 0; i < items.length; i += batchSize) {
    var batch = items.slice(i, i + batchSize);
    var res = await callApi(action, (function() {
      var o = {}; o[dataKey] = batch; return o;
    })());
    total += (res.added || batch.length);
    // 实时更新进度
    var msg = '正在导入 ' + (i + batch.length) + '/' + items.length + '...';
    var loadEl = document.getElementById('loadingText');
    if (loadEl) loadEl.textContent = msg;
    // 每批之间加 200ms 间隔，避免数据库压力
    if (i + batchSize < items.length) {
      await new Promise(function(r) { setTimeout(r, 200); });
    }
  }
  return total;
}

async function doImport(type) {
  var rows = importFileData[type];
  if (!rows || !rows.length) { toast('请先选择有效的Excel文件', 'error'); return; }

  var btnId = type === 'teacher' ? 'importTeacherBtn' : 'importParentBtn';
  document.getElementById(btnId).disabled = true;
  document.getElementById(btnId).textContent = '导入中...';
  showLoading('正在导入 ' + rows.length + ' 条数据...');

  try {
    var items;
    if (type === 'teacher') {
      items = rows.map(function(r) {
        return {
          name: String(r['姓名'] || r['name'] || '').trim(),
          phone: String(r['手机号'] || r['phone'] || '').trim(),
          subject: String(r['学科'] || r['subject'] || '').trim(),
          className: String(r['班级'] || r['className'] || '').trim()
        };
      }).filter(function(t) { return t.name && t.phone; });
      if (!items.length) { toast('未找到有效数据，请检查模板格式', 'error'); switchPage(currentPage); return; }
      var added = await batchImport('teacher', items);
      await refreshPage();
      toast('导入成功，共 ' + added + ' 条', 'success');
      addLog(currentUser.name, '导入教师', '成功导入 ' + added + ' 条');
    } else {
      items = rows.map(function(r) {
        return {
          name: String(r['学生姓名'] || r['姓名'] || r['name'] || '').trim(),
          idCard: String(r['身份证号'] || r['idCard'] || '').trim().toUpperCase(),
          className: String(r['班级'] || r['className'] || '').trim()
        };
      }).filter(function(s) { return s.name && s.idCard; });
      if (!items.length) { toast('未找到有效数据，请检查模板格式', 'error'); switchPage(currentPage); return; }
      var added2 = await batchImport('parent', items);
      await refreshPage();
      toast('导入成功，共 ' + added2 + ' 条', 'success');
      addLog(currentUser.name, '导入学生', '成功导入 ' + added2 + ' 条');
    }
    importFileData[type] = null;
  } catch (e) {
    toast(e.message || '导入失败', 'error');
    switchPage(currentPage);
  } finally {
    var btn = document.getElementById(btnId);
    if (btn) { btn.disabled = false; btn.textContent = '开始导入'; }
  }
}

async function createProject() {
  var title = document.getElementById('projTitle').value.trim();
  if (!title) { toast('请输入项目标题', 'error'); return; }
  if (!projPreviewData) { toast('请先上传Excel文件', 'error'); return; }

  // 过滤掉姓名和身份证号列
  var columns = projPreviewData.columns.filter(function(c) {
    return c !== '姓名' && c !== 'name' && c !== '身份证号' && c !== '身份证';
  });
  var nameCol = projPreviewData.columns.indexOf('姓名') >= 0 ? '姓名' : (projPreviewData.columns.indexOf('name') >= 0 ? 'name' : projPreviewData.columns[0]);
  var idCardCol = projPreviewData.columns.indexOf('身份证号') >= 0 ? '身份证号' : (projPreviewData.columns.indexOf('身份证') >= 0 ? '身份证' : null);

  // 建立学生姓名→身份证号映射
  var idCardMap = {};
  data.students.forEach(function(s) { idCardMap[s.name] = s.idCard; });

  var projectData = [];
  var newStudents = []; // 不在系统中的学生，需要自动添加
  projPreviewData.data.forEach(function(row) {
    var name = String(row[nameCol] || '').trim();
    // 优先从 Excel 提取身份证号，其次从学生库查找
    var idCard = idCardCol ? String(row[idCardCol] || '').trim().toUpperCase() : '';
    if (!idCard && idCardMap[name]) idCard = idCardMap[name];
    if (!idCard && name) {
      // 未找到身份证号，记录为新学生（如果有 Excel 中的身份证号就用，否则留空后续手动补）
      newStudents.push({ name: name, idCard: idCard || '', className: currentUser.className || '' });
    }
    var values = {};
    columns.forEach(function(col) { values[col] = row[col]; });
    projectData.push({ name: name, idCard: idCard, values: values });
  });

  showLoading('正在创建项目...');
  try {
    // 先自动添加不在系统中的学生（按姓名去重）
    if (newStudents.length) {
      var uniqueNew = [];
      var seen = {};
      newStudents.forEach(function(s) {
        if (!seen[s.name] && !idCardMap[s.name]) {
          seen[s.name] = true;
          uniqueNew.push(s);
        }
      });
      if (uniqueNew.length) {
        console.log('[createProject] 自动添加 ' + uniqueNew.length + ' 名新学生');
        try {
          await callApi('batchUpsertStudents', { students: uniqueNew });
        } catch (e) {
          console.warn('[createProject] 自动添加学生失败（不影响项目创建）:', e.message);
        }
      }
    }

    await callApi('addProject', {
      title: title,
      teacherId: currentUser.id,
      teacherName: currentUser.name,
      className: currentUser.className || '',
      columns: columns,
      data: projectData
    });
    await refreshPage();
    toast('项目创建成功', 'success');
    addLog(currentUser.name, '创建查询项目', title + '（' + projectData.length + ' 名学生）');
    switchPage('tProjects');
  } catch (e) {
    toast(e.message || '创建失败', 'error');
    switchPage(currentPage);
  }
}

    '<div class="form-item"><label class="form-label">身份证号</label><input class="form-input" id="addSTIdCard" maxlength="20" placeholder="大陆18位/港澳8-15位字母数字"></div>' +
    '<div class="form-item"><label class="form-label">班级</label><input class="form-input" id="addSTClass" value="'+(currentUser.className||'')+'" placeholder="如：高三(1)班"></div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="addStudentT()">保存</button>');
}

async function addStudentT() {
  var name = document.getElementById('addSTName').value.trim();
  var idCard = document.getElementById('addSTIdCard').value.trim().toUpperCase();
  var className = document.getElementById('addSTClass').value.trim();
  if (!name || !idCard || !className) { toast('请填写完整信息', 'error'); return; }
  if (idCard.length < 8) { toast('身份证号至少8位', 'error'); return; }

  closeModal();
  showLoading('正在保存...');
  try {
    await callApi('addStudent', { name: name, idCard: idCard, className: className });
    await refreshPage();
    toast('添加成功', 'success');
    addLog(currentUser.name, '新增学生', name + ' (' + className + ')');
  } catch (e) {
    toast(e.message || '添加失败', 'error');
    switchPage(currentPage);
  }
}

// 教师端：批量导入
var stuImportDataT = null;
function openStuImportT() {
  openModal('批量导入学生',
    '<div class="upload-area" onclick="document.getElementById(\'stuFileT\').click()"><div class="upload-icon">📁</div><div class="upload-text">点击选择 Excel 文件</div><div class="upload-hint" id="stuFileNameT">支持 .xlsx / .xls 格式</div></div>' +
    '<input type="file" id="stuFileT" accept=".xlsx,.xls" style="display:none" onchange="handleStuImportT(this)">' +
    '<div id="stuImportPreview" style="margin-top:16px"></div>' +
    '<div style="margin-top:16px;padding:12px;background:#F8F9FB;border-radius:8px;font-size:13px;color:#666;line-height:1.8"><b>模板字段：</b>学生姓名（必填）· 身份证号（必填）· 班级（必填）<br>支持大陆18位/港澳8-15位字母数字</div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="stuImportBtnT" onclick="doStuImportT()" disabled>开始导入</button>');
}

function handleStuImportT(input) {
  if (!input.files[0]) return;
  document.getElementById('stuFileNameT').textContent = input.files[0].name;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var workbook = XLSX.read(e.target.result, { type: 'array' });
      var sheet = workbook.Sheets[workbook.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet);
      stuImportDataT = rows;
      document.getElementById('stuImportBtnT').disabled = false;
      document.getElementById('stuImportPreview').innerHTML = '<div style="font-size:13px;color:#2D7A5F">✅ 解析成功，共 ' + rows.length + ' 条数据</div>';
      toast('解析成功，共 ' + rows.length + ' 条数据', 'success');
    } catch (err) {
      document.getElementById('stuImportPreview').innerHTML = '<div style="font-size:13px;color:#FF5252">❌ 文件解析失败: ' + err.message + '</div>';
      stuImportDataT = null;
    }
  };
  reader.readAsArrayBuffer(input.files[0]);
}

async function doStuImportT() {
  if (!stuImportDataT || !stuImportDataT.length) { toast('请先选择有效的Excel文件', 'error'); return; }

  var items = stuImportDataT.map(function(r) {
    return {
      name: String(r['学生姓名'] || r['姓名'] || r['name'] || '').trim(),
      idCard: String(r['身份证号'] || r['idCard'] || '').trim().toUpperCase(),
      className: String(r['班级'] || r['className'] || '').trim() || (currentUser.className || '')
    };
  }).filter(function(s) { return s.name && s.idCard; });

  if (!items.length) { toast('未找到有效数据，请检查模板格式', 'error'); return; }

  document.getElementById('stuImportBtnT').disabled = true;
  document.getElementById('stuImportBtnT').textContent = '导入中...';
  closeModal();
  showLoading('正在导入 ' + items.length + ' 条学生数据...');

  try {
    var total = 0;
    var batchSize = 5;
    for (var i = 0; i < items.length; i += batchSize) {
      var batch = items.slice(i, i + batchSize);
      var res = await callApi('batchUpsertStudents', { students: batch });
      total += (res.added || res.upserted || batch.length);
      var msg = '正在导入 ' + (i + batch.length) + '/' + items.length + '...';
      var loadEl = document.getElementById('loadingText');
      if (loadEl) loadEl.textContent = msg;
      if (i + batchSize < items.length) {
        await new Promise(function(r) { setTimeout(r, 200); });
      }
    }
    await refreshPage();
    toast('导入成功，共处理 ' + total + ' 条', 'success');
    addLog(currentUser.name, '批量导入学生', '共 ' + items.length + ' 条');
    stuImportDataT = null;
  } catch (e) {
    toast(e.message || '导入失败', 'error');
    switchPage(currentPage);
  }
}

// ========== 通用操作 ==========
function switchImportTab(e, id) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  e.target.classList.add('active');
  document.getElementById('teacherImport').style.display = id === 'teacherImport' ? '' : 'none';
  document.getElementById('parentImport').style.display = id === 'parentImport' ? '' : 'none';
}

function changePwd() {
  var oldP = document.getElementById('oldPwd').value;
  var newP = document.getElementById('newPwd').value;
  var newP2 = document.getElementById('newPwd2').value;
  if (!oldP || !newP || !newP2) { toast('请填写完整', 'error'); return; }
  if (newP !== newP2) { toast('两次密码不一致', 'error'); return; }
  if (newP.length < 8) { toast('新密码至少8位', 'error'); return; }
  toast('密码已更新', 'success');
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  document.getElementById('newPwd2').value = '';
  addLog(currentUser.name, '修改密码', '管理员密码已更新');
}

// 接龙活动（本地数据）
function openCreateActivity() {
  var defaultClass = currentUser.className || '';
  openModal('创建接龙活动',
    '<div class="form-item"><label class="form-label">活动名称</label><input class="form-input" id="actTitle" placeholder="如：高三第二次月考通知"></div>' +
    '<div class="form-item"><label class="form-label">通知内容</label><textarea class="form-input" id="actContent" rows="4" style="height:auto;padding:10px 14px;line-height:1.6" placeholder="请输入通知正文内容..."></textarea></div>' +
    '<div class="form-item"><label class="form-label">班级</label><input class="form-input" id="actClass" placeholder="如：高三(1)班" value="' + defaultClass + '"></div>' +
    '<div class="form-item"><label class="form-label">截止时间</label><input class="form-input" id="actDeadline" type="date"></div>',
    '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createActivity()">创建</button>');
}

async function createActivity() {
  var title = document.getElementById('actTitle').value.trim();
  if (!title) { toast('请输入活动名称', 'error'); return; }
  var content = document.getElementById('actContent').value || '';
  var className = document.getElementById('actClass').value || (currentUser.className || '');
  var deadline = document.getElementById('actDeadline').value || '';
  var teacherId = currentUser.id || '';
  var teacherName = currentUser.name || '';

  try {
    var res = await callApi('addActivity', {
      title: title,
      content: content,
      className: className,
      deadline: deadline,
      teacherId: teacherId,
      teacherName: teacherName,
      images: []
    });
    if (res.success) {
      data.activities.unshift(res.data);
      closeModal();
      switchPage(userRole === 'teacher' ? 'tActivities' : 'activities');
      toast('创建成功', 'success');
      addLog(currentUser.name, '创建接龙', title);
    } else {
      toast(res.message || '创建失败', 'error');
    }
  } catch(e) {
    toast('创建失败: ' + e.message, 'error');
  }
}

function viewActivity(id) {
  var a = data.activities.find(function(x) { return x.id === id; });
  if (!a) return;
  var joined = a.joined || [];
  var students = data.students.filter(function(s) { return s.className === a.className; });
  openModal('接龙详情 · ' + a.title,
    '<div style="margin-bottom:16px"><b>'+(a.className||'未指定班级')+'</b> · 班级 ' + students.length + ' 人 · 已接龙 ' + joined.length + ' 人</div>' +
    (a.content ? '<div style="margin-bottom:16px;padding:12px;background:#F5F6FA;border-radius:8px;font-size:13px;line-height:1.6">'+a.content+'</div>' : '') +
    '<table style="font-size:13px"><thead><tr><th>姓名</th><th>关系</th><th>备注</th><th>状态</th></tr></thead><tbody>' +
    students.map(function(s) {
      var j = joined.find(function(x) { return x.name === s.name; });
      return '<tr><td>'+s.name+'</td><td>'+(j?(j.relationship||'—'):'—')+'</td><td>'+(j?(j.remark||'—'):'—')+'</td><td>'+(j?'<span class="tag success">已接龙</span>':'<span class="tag warning">未接龙</span>')+'</td></tr>';
    }).join('') +
    '</tbody></table>',
    '<button class="btn" onclick="closeModal()">关闭</button>');
}

function closeActivity(id) {
  confirmDialog('确定关闭接龙？', function() {
    var a = data.activities.find(function(x) { return x.id === id; });
    if (a) a.status = 'finished';
    switchPage(userRole === 'teacher' ? 'tActivities' : 'activities');
    toast('已关闭', 'success');
  });
}

async function delActivity(id) {
  confirmDialog('确定删除此接龙活动？删除后不可恢复。', async function() {
    try {
      await callApi('deleteActivity', { id: id });
      data.activities = data.activities.filter(function(x) { return x.id !== id; });
      switchPage(userRole === 'teacher' ? 'tActivities' : 'activities');
      toast('已删除', 'success');
    } catch(e) {
      toast('删除失败: ' + e.message, 'error');
    }
  });
}

function filterLog() {
  var kw = document.getElementById('searchLog').value.toLowerCase();
  document.querySelectorAll('#logTable tbody tr').forEach(function(tr) {
    tr.style.display = tr.textContent.toLowerCase().includes(kw) ? '' : 'none';
  });
}
